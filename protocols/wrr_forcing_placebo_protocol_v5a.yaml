# WRR forcing-placebo and component-attribution protocol v5a
#
# This document is a PRE-OUTCOME specification.  Nothing in it has been run.
# It exists so that the placebo and component arms, unlike every forcing result
# so far, can be described as prospectively specified when they are executed.
# That property is destroyed the moment any of these outcomes is inspected, so
# the seal must be created before the first fit.

protocol_id: thermoroute_wrr_forcing_placebo_v5a
version: 5a
status: DRAFT_NOT_SEALED
execution_authorized: false
draft_date_utc: 2026-08-10
seal_path: null

relationship_to_prior_work:
  parent_protocol: protocols/wrr_information_regimes_protocol_v4.yaml
  builds_on:
    point_authority: outputs/final/forcing_regime_v5_observed_point_authority_v1
    inference_authority: outputs/final/forcing_regime_v5_observed_inference_authority_v1
  rule: |
    The v5 F0/F3_full contrast is a post-outcome descriptive result.  These
    placebo and component arms are the controls that would let it be
    interpreted as event-scale weather information rather than as calendar or
    seasonal-phase information.  They do not reopen, edit, or reinterpret the
    v5 authorities.

chronology:
  status_if_sealed_before_execution: PRE_OUTCOME_PROSPECTIVE_EXTENSION
  status_if_executed_first: POST_OUTCOME_ONLY
  already_inspected:
    - F0 and F3_full station-first point estimates and their inference
    - the 2021-2023 evaluation window generally
  never_inspected_at_draft_time:
    - any shuffled, shifted, or single-component forcing outcome
  qualification_rule: |
    Pre-outcome status requires that this file, the runner source hash, the
    frozen key registry, the estimand, and the stopping rule are all bound in a
    seal whose timestamp precedes the first placebo fit.  Draft status alone
    provides nothing.

# ---------------------------------------------------------------------------
# What the controls have to rule out
# ---------------------------------------------------------------------------

scientific_question: |
  F3_full supplies realized meteorology over t+1..t+h.  Its measured value
  (0.13 degC at one day, 0.54-0.63 degC at three and seven days) could in
  principle arise from four sources, only the first of which is the intended
  one:
    1. event-scale correspondence between a specific forecast issue and the
       specific weather that followed it;
    2. a sharper seasonal phase than the calendar features already carry;
    3. the marginal distribution of the future variables acting as an implicit
       regularizer or scale cue;
    4. target-day calendar information leaking through the future-feature
       index itself.
  The arms below are designed so that each control preserves some of these and
  destroys exactly one.

# ---------------------------------------------------------------------------
# Arms
# ---------------------------------------------------------------------------

arms:
  F3_true:
    label: realized future gridded meteorology (reference arm, already run)
    source: outputs/final/forcing_regime_v5_observed
    role: the value being validated; not refitted under this protocol

  F3_shuffle_month:
    label: within station-month shuffled future forcing
    construction: |
      Within each (site_id, calendar month of target_date) stratum, apply one
      permutation to the whole future-feature vector of every forecast key in
      that stratum.  The vector moves as a unit: variables are never permuted
      independently of one another, so within-day meteorological coherence is
      preserved and only the key-to-weather correspondence is destroyed.
    preserves: [station climate, seasonal phase to within a month, joint marginal distribution of the future variables]
    destroys: [event-scale correspondence between an issue and its realized weather]
    strata_key: [site_id, target_month]
    permutation_seeds: [0, 1, 2, 3, 4]
    derangement_rule: |
      Resample the permutation until no key retains its own future vector, for
      strata of size >= 2.  Strata of size 1 cannot be shuffled; they are
      excluded from the placebo contrast and counted in the exclusion ledger.
    expected_result_if_the_finding_is_real: |
      V_F(F3_shuffle_month) close to zero and far below V_F(F3_true).

  F3_shift_plus7:
    label: future forcing displaced +7 days
    construction: |
      For each forecast key, substitute the realized future features of the
      valid time t+h+7 in place of t+h, taken from the same raw future
      registry.  No interpolation, no wrap-around.
    preserves: [station climate, near-seasonal phase, joint marginals, local weather persistence]
    destroys: [exact event timing]
  F3_shift_minus7:
    label: future forcing displaced -7 days
    construction: as F3_shift_plus7 with t+h-7
    note: |
      The two shifts are reported separately and never averaged.  A -7 shift
      partially overlaps the issue-time information already available at F0,
      so it is the weaker control of the pair and is labelled as such.
    boundary_rule: |
      Keys whose shifted valid time falls outside the acquired future window
      are dropped from *both* shift arms and from F3_true within the shift
      contrast, so all three are scored on one common shift-registry.  That
      registry is named separately and is never mixed with the primary
      358,765-key registry.

  component_arms:
    label: single-variable and leave-one-out future forcing
    single:
      - future_air_temperature_only
      - future_radiation_only
      - future_precipitation_only
      - future_humidity_and_wind_only
    leave_one_out:
      - all_future_except_air_temperature
      - all_future_except_radiation
      - all_future_except_precipitation
      - all_future_except_humidity_and_wind
    full: F3_full
    additivity_rule: |
      The meteorological variables are strongly correlated, so single-component
      values do not sum to the full-forcing value and their differences are not
      variance decompositions.  Report single and leave-one-out values side by
      side and state the gap; never present either set as an attribution
      budget.
    discharge_rule: |
      Discharge is not a meteorological forcing variable and is excluded from
      every component arm.  It is analysed only in the separate flow ablation.

# ---------------------------------------------------------------------------
# Design held fixed across every arm
# ---------------------------------------------------------------------------

held_fixed:
  models: [LightGBM, ResidualLightGBM]
  horizons: [1, 3, 7]
  key_registry: outputs/final/information_regime_key_registries_v4/primary_reportable_key_registry_v4.parquet
  training_partition: 2006-2015
  validation_partition: 2016-2017
  evaluation_window: 2021-2023
  reportability_minimum_paired_targets: 100
  station_set_rule: intersection across every arm entering the declared contrast
  lineage_requirement: |
    Raw observedness must be captured before imputation, imputation must be
    fitted on the training partition only, no imputed water temperature may
    enter a training label or pass admissibility, and the LightGBM validation
    set must be the disjoint 2016-2017 partition.  This is the DLOG-025 defect
    and it is the one thing every runner under this protocol must prove it
    does not repeat.
  hyperparameters: |
    Frozen to the exact per-lead settings used by the v5 observed runner.  No
    arm may be retuned; a placebo that is allowed to retune can recover part of
    the destroyed signal through model selection.

# ---------------------------------------------------------------------------
# Estimands
# ---------------------------------------------------------------------------

estimands:
  arm_value: |
    V_F(arm) = median_i [ RMSE_i(F0) - RMSE_i(arm) ], degC, station-first, on
    the exact common keys of the declared contrast.
  placebo_contrast: |
    D_placebo = median_i [ RMSE_i(placebo arm) - RMSE_i(F3_true) ], formed per
    station before any median.  Positive means the placebo is worse than the
    true oracle, which is the direction that supports an event-scale reading.
  seed_aggregation: |
    For F3_shuffle_month, form the station-level contrast inside each of the
    five permutation seeds, then average the five contrasts per station.  Never
    pool keys across seeds and never concatenate seed outputs.
  uncertainty:
    interval: 10000-draw whole-HUC2 cluster bootstrap of the station-level contrast
    sensitivity: exact whole-HUC2 sign-flip enumeration and leave-one-HUC2 range
    minimum_detectable_effect: |
      Report the same shift-based MDE used by the v5 inference authority, so a
      null placebo result can be distinguished from an underpowered one.  A
      placebo that "shows nothing" is only informative if the design could have
      shown something.

# ---------------------------------------------------------------------------
# Decision rules, fixed before execution
# ---------------------------------------------------------------------------

decision_rules:
  P1_event_scale_supported: |
    If V_F(F3_shuffle_month) is below 25% of V_F(F3_true) at three and seven
    days, with the station-level placebo contrast excluding zero, then the
    forcing value is reported as event-scale weather information.
  P2_partly_seasonal: |
    If V_F(F3_shuffle_month) lies between 25% and 60% of V_F(F3_true), the
    forcing value is reported as containing a substantial seasonal-phase
    component, and the headline number is restated as the shuffle-corrected
    difference rather than the raw F0-F3 gap.
  P3_finding_withdrawn: |
    If V_F(F3_shuffle_month) exceeds 60% of V_F(F3_true), the F0/F3 forcing
    value is withdrawn as an information claim and reported only as a
    calendar/seasonal-phase artifact.  This outcome is admissible and must be
    reported if it occurs.
  P4_timing_specificity: |
    The +7-day shift is the primary timing control.  If V_F(F3_shift_plus7) is
    not materially below V_F(F3_true), the model is using seasonal level rather
    than event timing, and the lead-structure interpretation of Section 4.7 is
    withdrawn.
  stopping_rule: |
    Every arm listed here runs exactly once at the frozen settings.  There is
    no re-run on a different seed set, no addition of arms after inspection,
    and no promotion of a component arm to a headline that was not declared
    here.

# ---------------------------------------------------------------------------
# Reporting constraints inherited from v4
# ---------------------------------------------------------------------------

reporting_constraints:
  f3_naming: retrospective realized gridded meteorological oracle
  forbidden_claims:
    - operational forecast gain
    - deployable improvement
    - as-issued forecast value
    - weather-forecast value without an F2 comparison
  no_cross_experiment_ratio: |
    No value from these arms may be divided by an architecture, local-
    information, or geometry effect from a different cell of the design.  The
    crossed F x L x G x A matrix is the only object from which an interaction
    may be read.
  claim_ledger_requirement: |
    Every promoted number needs a claim-ledger entry with status
    DESCRIPTIVE_PROVISIONAL or PRIMARY_FROZEN, its source table, filters,
    paired estimator, print precision, and every used_in span, and the
    consistency gate must fail on any undeclared placebo headline.
