name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    # Fork pull requests are intentionally fail-closed: arbitrary fork code must
    # never execute in a checkout that contains data whose redistribution rights
    # remain unresolved. A future fork-safe job must use synthetic fixtures only.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        # locked = the exact declared environment for deterministic replay;
        # no current Route-A paper numbers exist before the one-time opening.
        # latest = compatibility check against the currently resolved versions
        # allowed by the loose requirements (this is not a minimum-version test).
        deps: [locked, latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Immutable upstream revisions: checkout v4.3.0, setup-python v5.6.0.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "locked" ]; then
            python -m pip install --require-hashes -r requirements-lock-py312-hashed.txt
          else
            python -m pip install -r requirements.txt
            # Latest exercises the loose runtime requirements, while the declared
            # build backend remains exact even when build isolation is disabled.
            python -m pip install --no-deps setuptools==81.0.0
          fi
          python -c "from importlib.metadata import version; assert version('setuptools') == '81.0.0', version('setuptools')"
          # Do not let editable installation resolve or fetch a second dependency
          # graph after the locked environment has been installed.
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Import smoke test
        run: |
          python -c "from thermoroute import config, data, features, datasets, baselines, air2stream, thermoroute, train, conformal, metrics, results, significance, decision, usgs; print('imports OK')"
      - name: Lint and type contracts
        if: ${{ matrix.deps == 'locked' }}
        run: |
          ruff check src tests
          ruff check --select F scripts
          mypy src/thermoroute --ignore-missing-imports
      - name: Unit tests (leakage + metrics + sample consistency)
        env:
          PYTHONPATH: src
        run: |
          # tests/test_sample_consistency is skipped when no usgs_predictions
          # file is shipped — that's intentional for CI on a clean checkout.
          pytest tests/ -q
      - name: Reproducibility, checkpoint, prediction-schema, and release contracts
        if: ${{ matrix.deps == 'locked' }}
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          pytest \
            tests/test_repro.py \
            tests/test_checkpoint.py \
            tests/test_prediction_schema.py \
            tests/test_manifest_release.py -q
      - name: Provenance manifest round trip (clean Git revision)
        if: ${{ matrix.deps == 'locked' }}
        run: |
          python scripts/14_manifest.py \
            --root "$PWD" --manifest /tmp/thermoroute-manifest.json
          python scripts/14_manifest.py \
            --root "$PWD" --manifest /tmp/thermoroute-manifest.json \
            --check --strict-git
      - name: Canonical Markdown to AGU TeX is current
        if: ${{ matrix.deps == 'locked' }}
        run: |
          python scripts/26_validate_claims.py --root "$PWD"
          PINNED_PANDOC="$(python -c \
            "from pathlib import Path; import pypandoc; print(Path(pypandoc.__file__).resolve().parent / 'files' / 'pandoc')")"
          test -x "$PINNED_PANDOC"
          PANDOC_PATH="$PINNED_PANDOC" \
            python paper/agu_submission/build_agu.py --check
      - name: Build and import the wheel outside the source tree
        if: ${{ matrix.deps == 'locked' }}
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/thermoroute-wheels
          python -m venv --system-site-packages /tmp/thermoroute-wheel-venv
          /tmp/thermoroute-wheel-venv/bin/pip install --no-deps \
            /tmp/thermoroute-wheels/thermoroute-*.whl
          (cd /tmp && /tmp/thermoroute-wheel-venv/bin/python -c \
            "import thermoroute; from thermoroute import results; print(results.PREDICTION_SCHEMA_VERSION)")
      - name: Data acquisition import (no network call)
        env:
          PYTHONPATH: src
        run: |
          python -c "from thermoroute.usgs import build_station, fetch_nwis_daily, fetch_daymet, fetch_gridmet_wind; print('usgs module OK')"
      - name: Synthetic smoke experiment (3 stations, 1 seed)
        if: ${{ matrix.deps == 'locked' }}
        env:
          PYTHONPATH: src
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          # A tiny end-to-end run that trains ThermoRoute for a few epochs on
          # deterministic generated data and asserts sane numerical behavior.
          # It does not read legacy files with unresolved redistribution rights.
          # persistence-beating skill sign is NOT required on the near-deterministic
          # synthetic series, but conformal coverage must be in a sane band and
          # the identical-keys invariant must hold. Guards against pipeline rot.
          python scripts/ci_smoke.py
      - name: Public distribution remains fail-closed
        if: ${{ matrix.deps == 'locked' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          builder_log="$(mktemp)"
          set +e
          bash scripts/make_release_archive.sh --distribution PUBLIC \
            >"$builder_log" 2>&1
          builder_status=$?
          set -e
          if [ "$builder_status" -ne 2 ] || \
             ! grep -Fq \
               "archive refused: PUBLIC distribution is blocked pending a byte-bound rights review" \
               "$builder_log"; then
            sed -n '1,120p' "$builder_log" >&2
            echo "PUBLIC builder did not fail through the declared gate" >&2
            exit 1
          fi

          verifier_log="$(mktemp)"
          set +e
          python scripts/verify_release.py --distribution PUBLIC \
            >"$verifier_log" 2>&1
          verifier_status=$?
          set -e
          if [ "$verifier_status" -ne 1 ] || \
             ! grep -Fq \
               "release verification failed: public distribution is blocked pending a byte-bound rights review" \
               "$verifier_log"; then
            sed -n '1,120p' "$verifier_log" >&2
            echo "PUBLIC verifier did not fail through the declared gate" >&2
            exit 1
          fi
