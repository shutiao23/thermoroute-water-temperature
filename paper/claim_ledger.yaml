# Claim ledger — WRR strong-accept redesign

Every headline number in the manuscript must resolve to exactly one row in
this ledger, and the row must resolve to one filter/estimand over an
authoritative table under `outputs/final/`.  The build
(`scripts/final/build_results_authority.py`) writes `claim_ledger_resolved.csv`
and fails if any claim is unresolved, duplicated, or contradicts its source.

Claim IDs follow `RQ<1-4>_<kind>_<horizon>_<suffix>`.  `used_in` uses the
manuscript section names; `latex_macro` is the macro emitted into
`outputs/final/paper_values.tex`.

