# --- Sections 4.7-4.10: post-outcome results promoted to the Abstract.
#
# These are the largest effects the study measured and they are post-outcome.
# Burying them outside the Abstract would hide the paper's strongest evidence;
# promoting them silently would let a reader assume they were pre-registered.
# POST_OUTCOME_PROMOTED takes neither option: the number is promoted, and the
# gate fails the build unless the span carrying it also says what it is.
