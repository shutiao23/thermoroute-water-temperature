<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="129mm" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Pre-opening design figure: information boundary, bounded correction, spatial gate, and receipt-gated effects</title>
  <desc id="desc">A four-panel vector concept figure for the Route-A pre-opening design. It contains no performance values, effects, confidence intervals, or p-values.</desc>
  <style>
    .base { font-family: Arial, Helvetica, sans-serif; fill: #1b1b1b; }
    .title { font-size: 21px; font-weight: 700; }
    .subtitle { font-size: 12px; fill: #4d4d4d; }
    .panel { fill: #ffffff; stroke: #4d4d4d; stroke-width: 1.4; }
    .panel-letter { font-size: 18px; font-weight: 700; fill: #ffffff; }
    .panel-title { font-size: 16px; font-weight: 700; }
    .label { font-size: 13px; }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .strong { font-weight: 700; }
    .muted { fill: #575757; }
    .allowed { fill: #dceee6; stroke: #007c6a; stroke-width: 1.2; }
    .forbidden { fill: #f9dfdf; stroke: #c23b22; stroke-width: 1.2; }
    .blue { fill: #dbeaf7; stroke: #2774ae; stroke-width: 1.2; }
    .orange { fill: #fde7cd; stroke: #d55e00; stroke-width: 1.3; }
    .gate { fill: #f8d7da; stroke: #b2182b; stroke-width: 1.8; }
    .pending { fill: #f2f2f2; stroke: #777777; stroke-width: 1; stroke-dasharray: 4 3; }
    .rule { stroke: #707070; stroke-width: 1; }
    .dash { stroke: #777777; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
    .arrow { stroke: #3d3d3d; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#3d3d3d"/>
    </marker>
  </defs>

  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="30" y="38" class="base title">Information boundary, bounded correction, spatial dependence, and receipt-gated effects</text>
  <text x="30" y="59" class="base subtitle">Route-A pre-opening design schematic — no outcome-period results, effect sizes, intervals, or p-values are shown.</text>

  <!-- Panel a -->
  <g id="panel-a">
    <rect x="30" y="84" width="550" height="348" rx="4" class="panel"/>
    <rect x="30" y="84" width="31" height="31" rx="4" fill="#007c6a"/>
    <text x="40" y="107" class="base panel-letter">a</text>
    <text x="74" y="107" class="base panel-title">Issue-time information boundary</text>
    <text x="74" y="127" class="base small muted">Route-A retrospective, date-indexed hindcast</text>

    <rect x="54" y="150" width="240" height="148" rx="4" class="allowed"/>
    <rect x="320" y="150" width="240" height="148" rx="4" class="forbidden"/>
    <text x="70" y="175" class="base label strong" fill="#006b5b">ALLOWED at issue time</text>
    <text x="70" y="198" class="base small">• WTEMP history through day t</text>
    <text x="70" y="220" class="base small">• historical date-indexed Daymet / gridMET</text>
    <text x="70" y="242" class="base small">• frozen climatology and damped anchor inputs</text>
    <text x="336" y="175" class="base label strong" fill="#a62a17">FORBIDDEN at issue time</text>
    <text x="336" y="198" class="base small">• target-date WTEMP outcomes</text>
    <text x="336" y="220" class="base small">• horizon-specific future weather forecasts</text>
    <text x="336" y="242" class="base small">• anticipatory covariate vintages</text>
    <text x="336" y="267" class="base tiny strong" fill="#a62a17">No leakage across the issue-time boundary</text>

    <line x1="70" y1="335" x2="532" y2="335" class="arrow"/>
    <line x1="307" y1="315" x2="307" y2="363" stroke="#1b1b1b" stroke-width="2"/>
    <text x="298" y="384" class="base label strong">t</text>
    <text x="258" y="404" class="base small">issue date</text>
    <text x="360" y="324" class="base small">targets: h ∈ {1, 3, 7} d</text>
    <text x="70" y="414" class="base tiny muted">Not as-issued operational availability • not ungauged prediction • not causal transport</text>
  </g>

  <!-- Panel b -->
  <g id="panel-b">
    <rect x="610" y="84" width="560" height="348" rx="4" class="panel"/>
    <rect x="610" y="84" width="31" height="31" rx="4" fill="#2774ae"/>
    <text x="620" y="107" class="base panel-letter">b</text>
    <text x="654" y="107" class="base panel-title">Bounded point correction</text>
    <text x="654" y="127" class="base small muted">Algebraic identity only; no scored-error claim</text>

    <rect x="638" y="150" width="504" height="108" rx="4" class="blue"/>
    <text x="890" y="180" text-anchor="middle" class="base" style="font-size:17px; font-weight:700;">ŷ(t+h) = A(t+h) + δ tanh( z(t+h) / δ )</text>
    <text x="890" y="203" text-anchor="middle" class="base label">z(t+h) = P(t+h) − A(t+h) + rθ(t+h)</text>
    <text x="890" y="225" text-anchor="middle" class="base small">δ = delta_scale = 1.0 °C; therefore ŷ(t+h) lies within A(t+h) ± δ</text>
    <text x="890" y="247" text-anchor="middle" class="base tiny muted">A: frozen damped anchor • P: learned thermal proposal • rθ: neural residual</text>

    <rect x="638" y="270" width="504" height="125" rx="4" class="orange"/>
    <text x="890" y="298" text-anchor="middle" class="base label strong" fill="#9b3f00">非安全界 / NOT A SAFETY BOUND</text>
    <text x="658" y="324" class="base small">The ±δ envelope bounds deviation from the anchor only.</text>
    <text x="658" y="346" class="base small">It does not bound absolute error, event-tail risk, interval width,</text>
    <text x="658" y="368" class="base small">post-shift behavior, or deployment safety. No regulatory guarantee.</text>
    <text x="658" y="390" class="base tiny strong" fill="#9b3f00">LIMIT_NO_SAFETY_GUARANTEE</text>
  </g>

  <!-- Panel c -->
  <g id="panel-c">
    <rect x="30" y="462" width="550" height="368" rx="4" class="panel"/>
    <rect x="30" y="462" width="31" height="31" rx="4" fill="#6a3d9a"/>
    <text x="40" y="485" class="base panel-letter">c</text>
    <text x="74" y="485" class="base panel-title">Fixed cohort geometry and inference gate</text>
    <text x="74" y="505" class="base small muted">Geometry is frozen before target-period outcomes are viewed.</text>

    <rect x="55" y="526" width="240" height="146" rx="4" fill="#eee7f4" stroke="#6a3d9a" stroke-width="1.2"/>
    <text x="175" y="552" text-anchor="middle" class="base label strong" fill="#532d79">FROZEN COHORT</text>
    <text x="175" y="582" text-anchor="middle" class="base" style="font-size:26px; font-weight:700;">120 sites</text>
    <text x="175" y="608" text-anchor="middle" class="base label">across 15 reportable HUC2 groups</text>
    <text x="175" y="632" text-anchor="middle" class="base tiny" style="font-size:10.5px;">2–26 sites per HUC2; largest share ≈ 21.7%</text>
    <text x="175" y="653" text-anchor="middle" class="base tiny" style="font-size:10.5px;">inverse-Herfindahl effective count ≈ 9.54</text>

    <path d="M295 599 L320 599" class="arrow"/>
    <rect x="320" y="526" width="235" height="146" rx="4" class="gate"/>
    <text x="437" y="552" text-anchor="middle" class="base label strong" fill="#8d1020">INFERENCE GATE</text>
    <text x="437" y="581" text-anchor="middle" class="base" style="font-size:19px; font-weight:700;">requires nclusters ≥ 30</text>
    <text x="437" y="606" text-anchor="middle" class="base small">effective fraction ≥ 0.75</text>
    <text x="437" y="627" text-anchor="middle" class="base small">largest share &lt; 0.25</text>
    <text x="437" y="654" text-anchor="middle" class="base label strong" fill="#8d1020">NECESSARILY FAILS</text>

    <line x1="55" y1="698" x2="554" y2="698" class="rule"/>
    <text x="55" y="723" class="base label strong">Consequent scope:</text>
    <text x="55" y="747" class="base small">fixed-cohort descriptive only — DESCRIPTIVE_ONLY_INFERENCE_GATE_FAILED</text>
    <text x="55" y="773" class="base tiny muted">Daily rows are not independent samples. No national representativeness or superpopulation claim.</text>
    <rect x="55" y="791" width="499" height="22" rx="3" class="pending"/>
    <text x="304" y="806" text-anchor="middle" class="base tiny muted">HUC2 redraw: registry-derived (redraw TODO); no scored performance is represented here.</text>
  </g>

  <!-- Panel d -->
  <g id="panel-d">
    <rect x="610" y="462" width="560" height="368" rx="4" class="panel"/>
    <rect x="610" y="462" width="31" height="31" rx="4" fill="#555555"/>
    <text x="620" y="485" class="base panel-letter">d</text>
    <text x="654" y="485" class="base panel-title">Predeclared five-row forest layout</text>
    <text x="654" y="505" class="base small muted">Values require verified opening evidence plus bound claim/QC gates.</text>

    <text x="628" y="535" class="base tiny strong">#</text>
    <text x="654" y="535" class="base tiny strong">Frozen comparison</text>
    <text x="858" y="535" class="base tiny strong">h</text>
    <text x="891" y="535" class="base tiny strong">Protocol margin</text>
    <text x="1014" y="535" class="base tiny strong">Effect / CI forest field</text>
    <line x1="626" y1="543" x2="1153" y2="543" class="rule"/>

    <g class="base tiny">
      <text x="628" y="571">1</text><text x="654" y="571">ThermoRoute − damped persistence</text><text x="858" y="571">1 d</text><text x="891" y="571">0.00 °C</text>
      <rect x="1008" y="552" width="139" height="28" rx="3" class="pending"/><text x="1077" y="570" text-anchor="middle">PENDING (receipt-derived)</text>
      <text x="628" y="611">2</text><text x="654" y="611">ThermoRoute − damped persistence</text><text x="858" y="611">3 d</text><text x="891" y="611">0.00 °C</text>
      <rect x="1008" y="592" width="139" height="28" rx="3" class="pending"/><text x="1077" y="610" text-anchor="middle">PENDING (receipt-derived)</text>
      <text x="628" y="651">3</text><text x="654" y="651">ThermoRoute − damped persistence</text><text x="858" y="651">7 d</text><text x="891" y="651">0.00 °C</text>
      <rect x="1008" y="632" width="139" height="28" rx="3" class="pending"/><text x="1077" y="650" text-anchor="middle">PENDING (receipt-derived)</text>
      <text x="628" y="691">4</text><text x="654" y="691">ThermoRoute − LightGBM</text><text x="858" y="691">3 d</text><text x="891" y="691">+0.05 °C ceiling</text>
      <rect x="1008" y="672" width="139" height="28" rx="3" class="pending"/><text x="1077" y="690" text-anchor="middle">PENDING (receipt-derived)</text>
      <text x="628" y="731">5</text><text x="654" y="731">ThermoRoute − LightGBM</text><text x="858" y="731">7 d</text><text x="891" y="731">+0.05 °C ceiling</text>
      <rect x="1008" y="712" width="139" height="28" rx="3" class="pending"/><text x="1077" y="730" text-anchor="middle">PENDING (receipt-derived)</text>
    </g>
    <rect x="626" y="753" width="527" height="58" rx="3" fill="#fff9e6" stroke="#c79200" stroke-width="1"/>
    <text x="638" y="773" class="base tiny strong">[pending — 探索期数据，不可写入结论]</text>
    <text x="638" y="791" class="base tiny">Fill only from the verified opening POST manifest and bound claim/QC gates. Development receipts are insufficient.</text>
    <text x="638" y="807" class="base tiny">Eligible wording remains fixed-cohort descriptive; CIs and p-values are assumption-conditional sensitivities.</text>
  </g>
</svg>
